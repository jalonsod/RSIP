services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rsip
      POSTGRES_USER: rsip
      POSTGRES_PASSWORD: rsip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  lms-mock:
    build:
      context: ../../lms-mock
    ports:
      - "8001:8001"
    environment:
      LMS_API_KEY: lms-dev-mock-key-rsip
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../../backend
      dockerfile: ../../infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rsip:rsip@postgres:5432/rsip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LMS_API_URL: http://lms-mock:8001
      LMS_API_KEY: lms-dev-mock-key-rsip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ../../backend
      dockerfile: ../../infra/docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://rsip:rsip@postgres:5432/rsip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LMS_API_URL: http://lms-mock:8001
      LMS_API_KEY: lms-dev-mock-key-rsip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    command: celery -A app.celery_app worker --loglevel=info

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../../infra/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
